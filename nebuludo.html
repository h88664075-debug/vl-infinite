<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090e1b">
<title>LUDO LEGENDS - منچ افسانه‌ای</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#090e1b;--panel:#151e30;--gold:#ffc857;
 --muted:#9aa9c0;--red:#ff5268;--green:#24d69a;
 --blue:#4da3ff;--yellow:#ffcc42;
}
body{
 margin:0;background:radial-gradient(circle at top,#1c2b49,#090e1b 65%);
 color:white;font-family:Tahoma,Arial,sans-serif;
 text-align:center;min-height:100vh;
}
header{padding:19px 10px 10px}
h1{
 margin:0;font-size:27px;color:var(--gold);
 text-shadow:0 0 20px #ffc85755;
}
.sub{font-size:11px;color:var(--muted);margin-top:8px}
.container{max-width:650px;margin:auto;padding:10px}
.panel{
 background:#151e30;border:1px solid #ffffff13;
 border-radius:18px;padding:13px;margin-bottom:12px;
 box-shadow:0 8px 25px #0004;
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
select,button{
 font-family:inherit;border:0;border-radius:12px;
 padding:12px 8px;font-weight:bold;font-size:13px;
}
select{background:#27364e;color:white}
button{
 background:linear-gradient(135deg,#ffdc78,#efa82d);
 color:#171b27;cursor:pointer;
 transition:.2s;
}
button:active{transform:scale(.96)}
button.secondary{background:#293851;color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.status{
 padding:13px;border-radius:13px;
 background:#202d44;color:#fff;font-size:13px;
 line-height:2;
}
.turn{color:var(--gold);font-weight:bold}
.players{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:6px;margin:12px 0;
}
.player{
 background:#202c40;border-radius:12px;padding:9px 3px;
 font-size:10px;line-height:2;opacity:.55;
 border:2px solid transparent;
}
.player.active{opacity:1;border-color:var(--gold);background:#34415a}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#board{
 display:block;width:100%;max-width:560px;margin:12px auto;
 border-radius:22px;background:#111b2b;
 border:3px solid #43516b;
 box-shadow:0 12px 35px #0009;
}
.token{cursor:pointer;transition:transform .2s}
.token circle{stroke:white;stroke-width:2.5}
.token.legal circle{stroke:#fff36c;stroke-width:5}
.token.legal{filter:drop-shadow(0 0 7px #ffe36b)}
.token text{font-size:11px;font-weight:bold;fill:#111}
#dice{
 width:78px;height:78px;margin:12px auto;
 background:linear-gradient(145deg,#fff,#dce5f2);
 border-radius:18px;color:#17253b;
 font-size:43px;display:flex;align-items:center;
 justify-content:center;
 box-shadow:0 8px 20px #0006;
}
.rolling{animation:roll .45s infinite}
@keyframes roll{
 0%{transform:rotate(0) scale(1)}
 50%{transform:rotate(180deg) scale(.8)}
 100%{transform:rotate(360deg) scale(1)}
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#message{color:#ffd166;font-size:12px;min-height:25px;padding:8px}
.stats{display:flex;justify-content:space-around;font-size:11px;color:#b8c7dc}
.stat b{display:block;font-size:18px;color:white;margin-top:5px}
footer{padding:20px;color:#71819a;font-size:10px}
#win{
 display:none;position:fixed;inset:0;z-index:20;
 background:#080d1bee;align-items:center;
 justify-content:center;padding:20px;
}
.winbox{
 width:100%;max-width:350px;background:#1d2b43;
 padding:30px 20px;border-radius:24px;
 border:1px solid #ffc85766;
 box-shadow:0 0 50px #ffc85733;
}
.winbox h2{color:var(--gold)}
@media(max-width:390px){
 h1{font-size:23px}
 .container{padding:6px}
 .panel{padding:9px}
}
</style>
</head>
<body>

<header>
<h1>👑 LUDO LEGENDS</h1>
<div class="sub">THE ULTIMATE OFFLINE BOARD GAME</div>
</header>

<main class="container">

<section class="panel">
 <div class="controls">
  <select id="playerCount">
   <option value="2">۲ بازیکن</option>
   <option value="3">۳ بازیکن</option>
   <option value="4" selected>۴ بازیکن</option>
  </select>
  <select id="gameMode">
   <option value="local">بازی خانوادگی</option>
   <option value="ai">بازی با ربات</option>
  </select>
  <select id="difficulty">
   <option value="1">ربات آسان</option>
   <option value="2" selected>ربات حرفه‌ای</option>
   <option value="3">ربات استاد</option>
  </select>
  <button onclick="newGame()">🎮 شروع بازی جدید</button>
 </div>
</section>

<section class="panel">
 <div class="status" id="status">برای شروع بازی تاس را بیندازید 🎲</div>
 <div class="players" id="players"></div>
 <svg id="board" viewBox="0 0 600 600" aria-label="صفحه بازی منچ"></svg>
 <div id="dice">🎲</div>
 <div class="actions">
  <button id="rollBtn" onclick="rollDice()">🎲 انداختن تاس</button>
  <button class="secondary" onclick="saveGame()">💾 ذخیره بازی</button>
 </div>
 <div id="message">برای خروج مهره باید عدد ۶ بیاورید.</div>
</section>

<section class="panel">
 <div class="stats">
  <div class="stat">حرکت‌ها<b id="moves">۰</b></div>
  <div class="stat">حذف مهره‌ها<b id="kills">۰</b></div>
  <div class="stat">بازی‌ها<b id="games">۰</b></div>
 </div>
</section>

<section class="panel">
 <div class="actions">
  <button class="secondary" onclick="loadGame()">📂 ادامه بازی ذخیره‌شده</button>
  <button class="secondary" onclick="toggleSound()">🔊 صدا روشن / خاموش</button>
 </div>
</section>

<footer>
LUDO LEGENDS © 2026 | OFFLINE EDITION
</footer>
</main>

<div id="win">
 <div class="winbox">
  <div style="font-size:60px">🏆</div>
  <h2 id="winnerText">قهرمان بازی!</h2>
  <p>تبریک! تو برنده مسابقه شدی.</p>
  <button onclick="newGame()">مسابقه دوباره 🔥</button>
 </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";

const colors=[
 {name:"قرمز",color:"#ff5268",start:0,base:[115,115],home:[300,75]},
 {name:"سبز",color:"#24d69a",start:13,base:[485,115],home:[525,300]},
 {name:"زرد",color:"#ffcc42",start:26,base:[485,485],home:[300,525]},
 {name:"آبی",color:"#4da3ff",start:39,base:[115,485],home:[75,300]}
];

const diceFaces=["⚀","⚁","⚂","⚃","⚄","⚅"];

let players=[];
let turn=0;
let dice=0;
let rolling=false;
let finished=false;
let sound=true;
let moves=0;
let kills=0;
let games=0;
let gameCount=4;
let mode="local";
let difficulty=2;
let currentLegal=[];
let audio=null;

const board=document.getElementById("board");

function el(tag,attrs={},parent=board){
 const e=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 parent.appendChild(e);
 return e;
}

function circle(x,y,r,fill,parent=board,stroke="none",sw=0){
 return el("circle",{cx:x,cy:y,r,fill,stroke,"stroke-width":sw},parent);
}

function text(x,y,value,size=14,fill="white",parent=board){
 const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"middle",fill,"font-size":size,"font-weight":"bold"},parent);
 e.textContent=value;
 return e;
}

function point(i){
 const a=-Math.PI/2+i*Math.PI*2/52;
 return [300+218*Math.cos(a),300+218*Math.sin(a)];
}

function homePoint(p,step){
 const a=-Math.PI/2+p*Math.PI/2;
 const x=300+218*Math.cos(a);
 const y=300+218*Math.sin(a);
 const t=(step+1)/7;
 return [x+(300-x)*t,y+(300-y)*t];
}

function drawBoard(){
 board.innerHTML="";

 el("rect",{x:0,y:0,width:600,height:600,rx:25,fill:"#17243a"});

 // چهار منطقه رنگی
 const zones=[
  [20,20,220,220,colors[0].color],
  [360,20,220,220,colors[1].color],
  [360,360,220,220,colors[2].color],
  [20,360,220,220,colors[3].color]
 ];
 zones.forEach(z=>{
  el("rect",{x:z[0],y:z[1],width:z[2],height:z[3],rx:30,fill:z[4],opacity:.19,stroke:z[4],"stroke-width":3});
 });

 // حلقه اصلی
 circle(300,300,240,"#26364e");
 circle(300,300,232,"#111c2e");

 for(let i=0;i<52;i++){
  const [x,y]=point(i);
  const safe=[0,13,26,39].includes(i);
  circle(x,y,14,safe?"#f4cf73":"#e6eaf0",board,safe?"#fff":"#64748b",2);
  if(safe)text(x,y,"★",13,"#25344c");
 }

 // خانه‌های پایانی
 for(let p=0;p<4;p++){
  for(let j=0;j<6;j++){
   const [x,y]=homePoint(p,j);
   circle(x,y,12,colors[p].color,board,"#fff",1.5);
  }
 }

 // مرکز
 el("circle",{cx:300,cy:300,r:60,fill:"#263750",stroke:"#ffc857","stroke-width":4});
 text(300,285,"LUDO",20,"#ffc857");
 text(300,310,"LEGENDS",11,"white");

 // خانه‌های مهره‌ها
 colors.forEach((c,p)=>{
  const [bx,by]=c.base;
  el("rect",{x:bx-77,y:by-77,width:154,height:154,rx:25,fill:c.color,opacity:.2,stroke:c.color,"stroke-width":3});
  for(let j=0;j<4;j++){
   const x=bx+(j%2?28:-28);
   const y=by+(j<2?-28:28);
   circle(x,y,17,"#152238",board,c.color,4);
  }
 });
}

function createPlayers(){
 const count=Number(document.getElementById("playerCount").value);
 gameCount=count;
 mode=document.getElementById("gameMode").value;
 difficulty=Number(document.getElementById("difficulty").value);

 const ids=count===2?[0,2]:count===3?[0,1,2]:[0,1,2,3];

 players=ids.map((id,index)=>({
  id,
  name:colors[id].name,
  color:colors[id].color,
  pieces:[-1,-1,-1,-1],
  wins:0,
  bot:mode==="ai"&&index!==0
 }));
 turn=0;dice=0;finished=false;rolling=false;
 currentLegal=[];moves=0;kills=0;
 document.getElementById("win").style.display="none";
 document.getElementById("message").textContent="برای خروج مهره عدد ۶ بیاورید.";
 update();
}

function newGame(){
 createPlayers();
 drawBoard();
 renderPieces();
 update();
}

function basePosition(p,j){
 const [bx,by]=colors[p.id].base;
 return [bx+(j%2?28:-28),by+(j<2?-28:28)];
}

function piecePosition(p,j){
 const v=p.pieces[j];
 if(v===-1)return basePosition(p,j);
 if(v===57){
  const [x,y]=colors[p.id].home;
  return [x,y];
 }
 if(v>=51)return homePoint(p.id,v-51);
 const [x,y]=point((colors[p.id].start+v)%52);
 return [x,y];
}

function renderPieces(){
 board.querySelectorAll(".token").forEach(e=>e.remove());

 players.forEach(p=>{
  p.pieces.forEach((v,j)=>{
   const [x,y]=piecePosition(p,j);
   const g=el("g",{class:"token"+(currentLegal.includes(j)&&p===players[turn]?" legal":"")});
   const r=el("circle",{cx:x,cy:y,r:13,fill:p.color,stroke:"#fff","stroke-width":2},g);
   el("circle",{cx:x-4,cy:y-4,r:4,fill:"#ffffff","fill-opacity":.5,stroke:"none"},g);
   if(v===57)text(x,y,"★",14,"#fff",g);
   else text(x,y,j+1,10,"#152238",g);
   g.addEventListener("click",()=>choosePiece(players.indexOf(p),j));
  });
 });
}

function update(){
 document.getElementById("status").innerHTML=
 finished?"بازی به پایان رسید":
 "نوبت: <span class='turn'>"+players[turn].name+"</span> "+
 (players[turn].bot?"🤖 ربات":"🎮 بازیکن")+" | "+(dice?"عدد تاس: "+dice:"منتظر تاس");

 document.getElementById("players").innerHTML=players.map((p,i)=>
 `<div class="player ${i===turn?"active":""}">
 <span class="dot" style="background:${p.color}"></span><br>
 ${p.name} ${p.bot?"🤖":"👤"}<br>
 ${p.pieces.filter(v=>v===57).length} از ۴ مهره
 </div>`).join("");

 document.getElementById("moves").textContent=moves;
 document.getElementById("kills").textContent=kills;
 document.getElementById("games").textContent=games;
 document.getElementById("rollBtn").disabled=finished||rolling||dice!==0||players[turn].bot;
}

function playSound(freq=500){
 if(!sound)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.frequency.value=freq;
  g.gain.value=.06;
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+.12);
 }catch(e){}
}

function toggleSound(){
 sound=!sound;
 document.getElementById("message").textContent=sound?"صدا روشن شد 🔊":"صدا خاموش شد 🔇";
}

function legalMoves(p,d){
 return p.pieces.map((v,j)=>{
  if(v===57)return false;
  if(v===-1)return d===6;
  return v+d<=57;
 }).map((ok,j)=>ok?j:-1).filter(j=>j!==-1);
}

function rollDice(){
 if(finished||rolling||dice!==0||players[turn].bot)return;
 rolling=true;
 const box=document.getElementById("dice");
 box.classList.add("rolling");
 let n=0;
 const interval=setInterval(()=>{
  const v=1+Math.floor(Math.random()*6);
  box.textContent=diceFaces[v-1];
  if(++n>=10){
   clearInterval(interval);
   dice=1+Math.floor(Math.random()*6);
   rolling=false;
   box.classList.remove("rolling");
   box.textContent=diceFaces[dice-1];
   playSound(400+dice*80);
   currentLegal=legalMoves(players[turn],dice);
   renderPieces();
   if(!currentLegal.length){
    document.getElementById("message").textContent="حرکت مجاز نداری!";
    setTimeout(nextTurn,false);
   }else{
    document.getElementById("message").textContent="مهره مورد نظر را انتخاب کن.";
    update();
    if(players[turn].bot) setTimeout(botMove,700);
   }
  }
 },65);
}

function choosePiece(pi,j){
 if(finished||pi!==turn||!currentLegal.includes(j)||players[turn].bot)return;
 movePiece(j);
}

function movePiece(j){
 const p=players[turn];
 let v=p.pieces[j];
 if(v===-1)p.pieces[j]=0;
 else p.pieces[j]+=dice;

 moves++;
 playSound(650);

 let capture=false;
 const newV=p.pieces[j];

 if(newV>=0&&newV<=50){
  const pos=(colors[p.id].start+newV)%52;
  if(![0,13,26,39].includes(pos)){
   players.forEach(other=>{
    if(other===p)return;
    other.pieces.forEach((ov,k)=>{
     if(ov>=0&&ov<=50&&
       (colors[other.id].start+ov)%52===pos){
       other.pieces[k]=-1;
       capture=true;
       kills++;
      }
    });
   });
  }
 }

 dice=0;currentLegal=[];
 renderPieces();

 if(capture){
  document.getElementById("message").textContent="💥 مهره حریف را زدی!";
  playSound(850);
 }else{
  document.getElementById("message").textContent=newV===57?"🏆 مهره به خانه نهایی رسید!":"حرکت انجام شد!";
 }

 if(p.pieces.every(v=>v===57)){
  finished=true;
  games++;
  document.getElementById("winnerText").textContent="🏆 "+p.name+" قهرمان شد!";
  setTimeout(()=>document.getElementById("win").style.display="flex",500);
  update();saveGame();
  return;
 }

 update();
 if(dice===0){
  if(capture){
   setTimeout(()=>{
    update();
    if(p.bot)botRoll();
   },500);
  }else{
   if(v===-1||p.pieces[j]===57||Math.abs(p.pieces[j]-v)>0&&v!==-1){
    // ادامه نوبت در صورت آوردن شش
   }
   if(lastRollSix){
    lastRollSix=false;
    setTimeout(()=>{if(p.bot)botRoll()},500);
   }else nextTurn();
  }
 }
}

let lastRollSix=false;

const oldRollDice=rollDice;
function botRoll(){
 if(finished||!players[turn].bot||dice!==0)return;
 rolling=false;
 const d=1+Math.floor(Math.random()*6);
 dice=d;
 lastRollSix=d===6;
 document.getElementById("dice").textContent=diceFaces[d-1];
 currentLegal=legalMoves(players[turn],dice);
 renderPieces();
 update();
 if(!currentLegal.length){
  setTimeout(()=>nextTurn(),500);
  return;
 }
 setTimeout(botMove,650);
}

// تاس انسانی و ربات
const originalRollDice=rollDice;
rollDice=function(){
 if(finished||rolling||dice!==0||players[turn].bot)return;
 rolling=true;
 const box=document.getElementById("dice");
 box.classList.add("rolling");
 let n=0;
 const interval=setInterval(()=>{
  const v=1+Math.floor(Math.random()*6);
  box.textContent=diceFaces[v-1];
  if(++n>=10){
   clearInterval(interval);
   dice=1+Math.floor(Math.random()*6);
   rolling=false;
   box.classList.remove("rolling");
   lastRollSix=dice===6;
   box.textContent=diceFaces[dice-1];
   playSound(400+dice*80);
   currentLegal=legalMoves(players[turn],dice);
   renderPieces();
   update();
   if(!currentLegal.length){
    document.getElementById("message").textContent="حرکت مجاز نداری!";
    setTimeout(()=>nextTurn(),700);
   }else{
    document.getElementById("message").textContent="مهره مورد نظر را انتخاب کن.";
   }
  }
 },65);
};

function botMove(){
 if(finished||!players[turn].bot||!currentLegal.length)return;
 const p=players[turn];
 let choices=currentLegal.map(j=>{
  const v=p.pieces[j];
  const target=v===-1?0:v+dice;
  let score=Math.random()*difficulty;
  if(v===-1)score+=dice===6?30:0;
  if(target===57)score+=100;
  if(target>=51)score+=20;
  if(target>=0&&target<=50){
   const pos=(colors[p.id].start+target)%52;
   players.forEach(o=>{
    if(o===p)return;
    o.pieces.forEach(ov=>{
     if(ov>=0&&ov<=50&&(colors[o.id].start+ov)%52===pos)score+=50;
    });
   });
  }
  score+=target*.15;
  return {j,score};
 });
 choices.sort((a,b)=>b.score-a.score);
 movePiece(choices[0].j);
}

function nextTurn(){
 if(finished)return;
 dice=0;currentLegal=[];lastRollSix=false;
 turn=(turn+1)%players.length;
 document.getElementById("dice").textContent="🎲";
 renderPieces();
 update();
 if(players[turn].bot)setTimeout(botRoll,650);
}

function saveGame(){
 try{
  const data={
   players,turn,dice,moves,kills,games,
   gameCount,mode,difficulty
  };
  localStorage.setItem("ludo_legends_save",JSON.stringify(data));
  document.getElementById("message").textContent="💾 بازی ذخیره شد!";
 }catch(e){
  document.getElementById("message").textContent="ذخیره امکان‌پذیر نیست.";
 }
}

function loadGame(){
 try{
  const data=JSON.parse(localStorage.getItem("ludo_legends_save"));
  if(!data)throw Error();
  players=data.players;
  turn=data.turn;
  dice=data.dice;
  moves=data.moves||0;
  kills=data.kills||0;
  games=data.games||0;
  gameCount=data.gameCount;
  mode=data.mode;
  difficulty=data.difficulty;
  document.getElementById("playerCount").value=gameCount;
  document.getElementById("gameMode").value=mode;
  document.getElementById("difficulty").value=difficulty;
  finished=false;rolling=false;
  currentLegal=dice?legalMoves(players[turn],dice):[];
  drawBoard();renderPieces();update();
  document.getElementById("dice").textContent=dice?diceFaces[dice-1]:"🎲";
  document.getElementById("message").textContent="بازی قبلی بارگذاری شد!";
  if(players[turn].bot){
   if(dice)setTimeout(botMove,700);
   else setTimeout(botRoll,700);
  }
 }catch(e){
  document.getElementById("message").textContent="بازی ذخیره‌شده‌ای پیدا نشد!";
 }
}

newGame();
</script>
</body>
</html>
