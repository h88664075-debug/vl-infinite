<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10152d">
<title>Nebuludo | منچ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#29345c,#10152d 65%);font-family:Tahoma,Arial;color:white;min-height:100vh}
header{text-align:center;padding:17px 10px 8px}
.logo{font-size:30px;font-weight:1000;letter-spacing:2px;color:#ffe28a;text-shadow:0 3px 15px #ffad35}
.sub{font-size:11px;color:#b7c4ed;margin-top:5px}
.wrap{width:min(96vw,680px);margin:auto;padding:8px 8px 25px}
.panel{background:#202b4a;border:1px solid #45577f;border-radius:18px;padding:12px;box-shadow:0 9px 25px #0005}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.turn{font-weight:bold;font-size:14px}
.status{font-size:11px;color:#c8d5f5;margin-top:5px}
.pill{background:#111a32;border-radius:20px;padding:8px 12px;font-size:11px;color:#ffe28a}
.boardbox{background:#111a30;border-radius:20px;padding:7px;border:1px solid #52628b;box-shadow:0 12px 30px #0008}
canvas{display:block;width:100%;height:auto;border-radius:13px;touch-action:manipulation}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
button{border:0;border-radius:14px;padding:14px 9px;font-weight:bold;font-size:14px;color:white;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.dice{background:linear-gradient(145deg,#ffe89a,#f5a92d);color:#38220b;font-size:19px;box-shadow:0 5px 0 #a86619}
.secondary{background:#35466e;border:1px solid #6175a2}
.dice:disabled{opacity:.5}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.player{border-radius:12px;padding:9px 4px;text-align:center;background:#17213b;border:1px solid #425477;font-size:10px}
.player strong{display:block;font-size:12px;margin-bottom:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;font-size:11px;padding:12px 5px}
.help{font-size:11px;line-height:2;color:#b9c8e9;text-align:center;margin:12px 4px}
.overlay{position:fixed;inset:0;background:#080d1deF;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(420px,100%);background:linear-gradient(145deg,#29375d,#151e39);border:1px solid #6379a9;border-radius:24px;padding:25px 18px;text-align:center;box-shadow:0 20px 70px #000b}
.modal h1{color:#ffe18a;font-size:29px;margin:5px}
.modal p{font-size:12px;color:#c4d1ee;line-height:2}
.startbtn{width:100%;background:linear-gradient(145deg,#ffe89a,#f3a52b);color:#34210b;margin-top:12px}
select{width:100%;padding:12px;border-radius:12px;background:#101a32;color:white;border:1px solid #62749d;margin-top:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
 <div class="logo">✦ NEBULUDO ✦</div>
 <div class="sub">چهار نفره • آفلاین • بازی کلاسیک منچ</div>
</header>

<div class="wrap">
 <div class="panel">
  <div class="topbar">
   <div>
    <div class="turn" id="turn">نوبت قرمز</div>
    <div class="status" id="status">برای شروع تاس بریز!</div>
   </div>
   <div class="pill" id="diceResult">🎲 تاس: ـ</div>
  </div>

  <div class="boardbox">
   <canvas id="board" width="640" height="640"></canvas>
  </div>

  <div class="controls">
   <button class="dice" id="roll">🎲 پرتاب تاس</button>
   <button class="secondary" id="newGame">↻ بازی جدید</button>
  </div>

  <div class="info" id="players"></div>
  <div class="actions">
   <button class="secondary" id="sound">🔊 صدا: روشن</button>
   <button class="secondary" id="rules">📖 قوانین</button>
   <button class="secondary" id="save">💾 ذخیره</button>
  </div>
  <div class="help">بعد از آوردن ۶، مهره از خانه خارج می‌شود. بعد از تاس، روی مهرهٔ موردنظر بزن تا حرکت کند.</div>
 </div>
</div>

<div class="overlay" id="welcome">
 <div class="modal">
  <div style="font-size:48px">🎲</div>
  <h1>NEBULUDO</h1>
  <p>بازی منچ چهار نفره<br>با دوستانت دور یک گوشی بازی کن!</p>
  <label style="font-size:12px">تعداد بازیکنان</label>
  <select id="playerCount">
   <option value="4">۴ بازیکن</option>
   <option value="3">۳ بازیکن</option>
   <option value="2">۲ بازیکن</option>
  </select>
  <button class="startbtn" id="start">شروع بازی 🚀</button>
 </div>
</div>

<div class="overlay hidden" id="message">
 <div class="modal">
  <div style="font-size:48px">🏆</div>
  <h1 id="winnerText">برنده!</h1>
  <p>همهٔ مهره‌ها به مقصد رسیدند!</p>
  <button class="startbtn" id="again">بازی دوباره</button>
 </div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const colors=[
 {name:"قرمز",color:"#f04455",dark:"#a91f36",light:"#ff9e9e"},
 {name:"سبز",color:"#28c987",dark:"#087a55",light:"#9affd3"},
 {name:"زرد",color:"#ffc83d",dark:"#b77b0b",light:"#fff0a1"},
 {name:"آبی",color:"#438cff",dark:"#2052ae",light:"#a7d2ff"}
];

const track=[];
for(let x=1;x<=14;x++) track.push([x,1]);
for(let y=2;y<=14;y++) track.push([14,y]);
for(let x=13;x>=1;x--) track.push([x,14]);
for(let y=13;y>=2;y--) track.push([1,y]);

const starts=[6,19,32,45];
const lanes=[
 [[7.5,2],[7.5,3],[7.5,4],[7.5,5],[7.5,6],[7.5,7]],
 [[13,7.5],[12,7.5],[11,7.5],[10,7.5],[9,7.5],[8,7.5]],
 [[7.5,13],[7.5,12],[7.5,11],[7.5,10],[7.5,9],[7.5,8]],
 [[2,7.5],[3,7.5],[4,7.5],[5,7.5],[6,7.5],[7,7.5]]
];

let players=[];
let current=0;
let dice=0;
let rolling=false;
let soundOn=true;
let sixCount=0;
let gameOver=false;
let cell=40;
let offset=0;

function init(count=4){
 players=colors.slice(0,count).map((c,i)=>({
  ...c,id:i,tokens:[-1,-1,-1,-1]
 }));
 current=0;dice=0;rolling=false;sixCount=0;gameOver=false;
 $("message").classList.add("hidden");
 $("diceResult").textContent="🎲 تاس: ـ";
 setStatus("برای شروع تاس بریز!");
 draw();updateUI();saveGame();
}

function saveGame(){
 try{
  localStorage.setItem("nebuludo-save",JSON.stringify({
   players:players.map(p=>({id:p.id,tokens:p.tokens})),
   current,dice,sixCount
  }));
 }catch(e){}
}

function loadGame(){
 try{
  const data=JSON.parse(localStorage.getItem("nebuludo-save"));
  if(!data||!data.players)return false;
  players=data.players.map(p=>({...colors[p.id],id:p.id,tokens:p.tokens}));
  current=data.current||0;dice=0;sixCount=data.sixCount||0;
  if(!players.length)return false;
  draw();updateUI();setStatus("بازی ذخیره‌شده بارگذاری شد.");
  return true;
 }catch(e){return false}
}

function setStatus(t){$("status").textContent=t}

function point(x,y){
 return [offset+x*cell,offset+y*cell];
}
function rounded(x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);
 ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
}
function circle(x,y,r,fill,stroke){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
}

function basePositions(id){
 const coords=[
  [[2.7,2.7],[4.5,2.7],[2.7,4.5],[4.5,4.5]],
  [[11.5,2.7],[13.3,2.7],[11.5,4.5],[13.3,4.5]],
  [[11.5,11.5],[13.3,11.5],[11.5,13.3],[13.3,13.3]],
  [[2.7,11.5],[4.5,11.5],[2.7,13.3],[4.5,13.3]]
 ];
 return coords[id];
}
function tokenPosition(id,n){
 const p=players[id],progress=p.tokens[n];
 if(progress<0)return basePositions(id)[n];
 if(progress>=52)return lanes[id][Math.min(5,progress-52)];
 return track[(starts[id]+progress)%52];
}

function drawBase(id){
 const c=players[id];if(!c)return;
 const rects=[
  [0.35,0.35,5.25,5.25],
  [10.4,0.35,5.25,5.25],
  [10.4,10.4,5.25,5.25],
  [0.35,10.4,5.25,5.25]
 ];
 const [x,y,w,h]=rects[id];
 const px=offset+x*cell,py=offset+y*cell;
 rounded(px,py,w*cell,h*cell,22,c.dark);
 rounded(px+12,py+12,w*cell-24,h*cell-24,17,c.color);
 rounded(px+28,py+28,w*cell-56,h*cell-56,13,"#f8f8ff");
 basePositions(id).forEach((pos,n)=>{
  const [tx,ty]=point(...pos);
  circle(tx,ty,18,"#d9deed","#a2acc5");
  drawToken(tx,ty,c,n,false);
 });
}

function drawTrack(){
 for(let i=0;i<track.length;i++){
  const [x,y]=point(...track[i]);
  const owner=starts.indexOf(i);
  let fill="#e9edf7";
  if(owner>=0)fill=colors[owner].color;
  if(i%13===0)fill=colors[starts.indexOf(i)]?.color||fill;
  rounded(x-18,y-18,36,36,7,fill,"#a9b5ce");
  if(owner>=0){
   circle(x,y,5,"#fff");
  }
 }
}

function drawHomeLanes(){
 for(let id=0;id<4;id++){
  lanes[id].forEach((p,i)=>{
   const [x,y]=point(...p);
   rounded(x-17,y-17,34,34,7,colors[id].color,"#ffffff99");
   if(i===5)circle(x,y,5,"#fff");
  });
 }
}

function drawCenter(){
 const [cx,cy]=point(7.5,7.5);
 ctx.save();
 ctx.translate(cx,cy);
 ctx.beginPath();
 ctx.moveTo(-38,-38);ctx.lineTo(38,-38);ctx.lineTo(38,38);ctx.lineTo(-38,38);ctx.closePath();
 ctx.fillStyle="#f5f3ee";ctx.fill();
 const triangles=[
  [0,0,-38,-38,38,-38,colors[0].color],
  [0,0,38,-38,38,38,colors[1].color],
  [0,0,38,38,-38,38,colors[2].color],
  [0,0,-38,38,-38,-38,colors[3].color]
 ];
 triangles.forEach(t=>{
  ctx.beginPath();ctx.moveTo(t[0],t[1]);ctx.lineTo(t[2],t[3]);ctx.lineTo(t[4],t[5]);ctx.closePath();
  ctx.fillStyle=t[6];ctx.fill();
 });
 circle(0,0,7,"#fff");
 ctx.restore();
}

function drawToken(x,y,c,n,selected){
 ctx.save();
 ctx.shadowColor="#0009";ctx.shadowBlur=selected?15:7;ctx.shadowOffsetY=5;
 const grad=ctx.createRadialGradient(x-7,y-9,2,x,y,19);
 grad.addColorStop(0,c.light);grad.addColorStop(.45,c.color);grad.addColorStop(1,c.dark);
 circle(x,y,16,grad,"#ffffff");
 ctx.shadowColor="transparent";
 circle(x,y-4,5,"#ffffffaa");
 if(selected){
  ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);
  ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
 }
 ctx.restore();
}

function draw(){
 const W=640;
 ctx.clearRect(0,0,W,W);
 const bg=ctx.createLinearGradient(0,0,W,W);
 bg.addColorStop(0,"#e8edf9");bg.addColorStop(1,"#b9c8e5");
 rounded(0,0,W,W,16,bg);
 offset=0;cell=40;
 drawBase(0);drawBase(1);drawBase(2);drawBase(3);
 drawTrack();drawHomeLanes();drawCenter();

 const occupied={};
 players.forEach(p=>p.tokens.forEach((v,n)=>{
  if(v<0)return;
  const pos=tokenPosition(p.id,n);
  const key=pos[0]+","+pos[1];
  (occupied[key]??=[]).push({p,n});
 }));
 Object.values(occupied).forEach(group=>{
  group.forEach(({p,n},i)=>{
   const pos=tokenPosition(p.id,n);
   const [x,y]=point(pos[0],pos[1]);
   const shift=group.length>1?(i-(group.length-1)/2)*7:0;
   drawToken(x+shift,y,p,n,false);
  });
 });
}

function updateUI(){
 const p=players[current];
 $("turn").textContent="نوبت "+(p?.name||"ـ");
 $("turn").style.color=p?.color||"white";
 $("players").innerHTML=players.map((pl,i)=>{
  const finished=pl.tokens.filter(v=>v===58).length;
  return `<div class="player" style="border-color:${pl.color}">
   <strong style="color:${pl.color}">● ${pl.name}</strong>
   ${finished}/4 خانه
  </div>`;
 }).join("");
 $("roll").disabled=rolling||gameOver||dice!==0;
}

function beep(freq=500,duration=.12){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC(),osc=ac.createOscillator(),gain=ac.createGain();
  osc.frequency.value=freq;osc.type="sine";
  gain.gain.setValueAtTime(.08,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
  osc.connect(gain);gain.connect(ac.destination);
  osc.start();osc.stop(ac.currentTime+duration);
  setTimeout(()=>ac.close(),300);
 }catch(e){}
}

function canMove(p,value){
 return p.tokens.map((v,i)=>({v,i})).filter(t=>
  t.v===-1?value===6:(t.v<58&&t.v+value<=58)
 ).map(t=>t.i);
}

function rollDice(){
 if(rolling||gameOver||dice!==0)return;
 rolling=true;updateUI();
 let ticks=0;
 const anim=setInterval(()=>{
  const temp=1+Math.floor(Math.random()*6);
  $("diceResult").textContent="🎲 تاس: "+temp;
  ticks++;
  if(ticks>=10){
   clearInterval(anim);
   dice=1+Math.floor(Math.random()*6);
   rolling=false;
   $("diceResult").textContent="🎲 تاس: "+dice;
   beep(650,.18);
   if(dice===6)sixCount++;else sixCount=0;
   if(sixCount>=3){
    setStatus("سه بار پشت سر هم ۶ آوردی! نوبت از دست رفت.");
    dice=0;sixCount=0;setTimeout(nextPlayer,1100);
    return;
   }
   const moves=canMove(players[current],dice);
   if(!moves.length){
    setStatus("مهره‌ای برای این تاس نداری.");
    const extra=dice===6;
    dice=0;
    setTimeout(()=>{if(!extra)nextPlayer();else setStatus("۶ آوردی؛ دوباره تاس بریز!");updateUI()},1000);
   }else{
    setStatus(moves.length===1?"مهرهٔ روشن‌شده را انتخاب کن.":"یکی از مهره‌هایت را انتخاب کن.");
    draw();updateUI();
   }
  }
 },75);
}

function nextPlayer(){
 dice=0;
 current=(current+1)%players.length;
 setStatus("نوبت "+players[current].name+" است.");
 draw();updateUI();saveGame();
}

function moveToken(id,n){
 const p=players[id],old=p.tokens[n];
 if(old===-1){
  p.tokens[n]=0;
 }else{
  p.tokens[n]+=dice;
 }
 const newProgress=p.tokens[n];
 dice=0;
 beep(720,.13);

 if(newProgress<52){
  const global=(starts[id]+newProgress)%52;
  const safe=starts.includes(global)||[5,18,31,44].includes(global);
  if(!safe){
   players.forEach(other=>{
    if(other.id===id)return;
    other.tokens.forEach((v,k)=>{
     if(v>=0&&v<52&&(starts[other.id]+v)%52===global){
      other.tokens[k]=-1;
      setStatus("آفرین! مهرهٔ "+other.name+" را زدی!");
      beep(250,.25);
     }
    });
   });
  }
 }
 const won=p.tokens.every(v=>v===58);
 if(won){
  gameOver=true;
  $("winnerText").textContent="🏆 "+p.name+" برنده شد!";
  $("message").classList.remove("hidden");
 }
 const extra=(newProgress===58||old===-1&&dice===6);
 if(!gameOver){
  if(extra){
   setStatus("حرکت عالی! دوباره تاس بریز.");
  }else{
   setTimeout(nextPlayer,450);
  }
 }
 draw();updateUI();saveGame();
}

function handleBoardTap(e){
 if(dice===0||rolling||gameOver)return;
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left)*640/rect.width;
 const y=(e.clientY-rect.top)*640/rect.height;
 const moves=canMove(players[current],dice);
 const p=players[current];
 let chosen=-1,best=999;
 moves.forEach(n=>{
  const pos=tokenPosition(p.id,n);
  const [tx,ty]=point(pos[0],pos[1]);
  const d=Math.hypot(x-tx,y-ty);
  if(d<32&&d<best){best=d;chosen=n}
 });
 if(chosen>=0)moveToken(current,chosen);
}

$("roll").addEventListener("click",rollDice);
canvas.addEventListener("pointerdown",handleBoardTap);
$("start").addEventListener("click",()=>{
 init(Number($("playerCount").value));
 $("welcome").classList.add("hidden");
});
$("newGame").addEventListener("click",()=>{
 if(confirm("بازی از اول شروع شود؟"))init(players.length||4);
});
$("again").addEventListener("click",()=>{
 init(players.length||4);
 $("message").classList.add("hidden");
});
$("sound").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 صدا: روشن":"🔇 صدا: خاموش";
});
$("rules").addEventListener("click",()=>{
 alert("قوانین بازی:\n\n۱. برای خارج کردن مهره باید ۶ بیاوری.\n۲. با آوردن ۶ یک نوبت اضافه داری.\n۳. اگر روی مهرهٔ حریف فرود بیایی، آن مهره به خانه برمی‌گردد.\n۴. خانه‌های امن قابل زدن نیستند.\n۵. برای ورود به خانهٔ پایانی باید عدد دقیق بیاوری.\n۶. هرکس هر چهار مهره را به مقصد برساند برنده است.");
});
$("save").addEventListener("click",()=>{
 saveGame();setStatus("بازی ذخیره شد.");
});
if(!loadGame())init(4);
})();
</script>
</body>
</html>
