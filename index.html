<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN STYLE | فروشگاه پوشاک</title>
  <meta name="description" content="فروشگاه آنلاین پوشاک URBAN STYLE">

  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #171717;
      --muted: #777;
      --accent: #111;
      --line: #e7e7e7;
      --danger: #d94343;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
    }

    /* Header */
    header {
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      min-height: 70px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span { color: #777; }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .cart-button {
      position: relative;
      background: #111;
      color: white;
      border-radius: 12px;
      padding: 11px 16px;
    }

    .cart-count {
      background: white;
      color: #111;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 12px;
      margin-right: 5px;
    }

    /* Hero */
    .hero {
      max-width: 1200px;
      margin: 25px auto;
      min-height: 410px;
      padding: 55px 45px;
      border-radius: 28px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.15)),
        url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    }

    .hero h1 {
      font-size: clamp(36px, 7vw, 70px);
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
      max-width: 500px;
      color: #eee;
      line-height: 2;
    }

    .hero button {
      background: white;
      color: #111;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: bold;
      width: max-content;
      margin-top: 10px;
    }

    /* Main */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 10px 20px 60px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 40px 0 18px;
    }

    .section-title h2 { margin: 0; }

    .search {
      width: min(100%, 340px);
      padding: 13px 16px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      outline: none;
    }

    .search:focus { border-color: #999; }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter {
      background: white;
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 999px;
    }

    .filter.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* Products */
    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      transition: transform .2s;
    }

    .product:hover { transform: translateY(-5px); }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1.1;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .product-info { padding: 15px; }

    .product-category {
      color: var(--muted);
      font-size: 12px;
    }

    .product h3 {
      margin: 7px 0;
      font-size: 16px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 13px;
    }

    .price {
      font-weight: bold;
      font-size: 15px;
    }

    .add-button {
      background: #111;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
    }

    /* Cart */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 40;
      display: none;
    }

    .overlay.show { display: block; }

    .cart {
      position: fixed;
      top: 0;
      left: 0;
      width: min(430px, 100%);
      height: 100vh;
      background: white;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform .3s;
      display: flex;
      flex-direction: column;
    }

    .cart.open { transform: translateX(0); }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close {
      background: #eee;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
    }

    .cart-items {
      padding: 15px;
      flex: 1;
      overflow-y: auto;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px 15px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .cart-item img {
      width: 70px;
      height: 85px;
      object-fit: cover;
      border-radius: 10px;
    }

    .cart-item h4 { margin: 0 0 7px; }

    .quantity {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .quantity button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #eee;
    }

    .remove {
      background: none;
      color: var(--danger);
      padding: 5px 0;
      font-size: 12px;
    }

    .cart-footer {
      padding: 18px;
      border-top: 1px solid var(--line);
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .checkout {
      width: 100%;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 25px;
      right: 50%;
      transform: translateX(50%);
      background: #111;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      z-index: 100;
      display: none;
    }

    footer {
      background: #111;
      color: #aaa;
      padding: 40px 20px;
      text-align: center;
    }

    footer strong {
      color: white;
      font-size: 20px;
    }

    @media (max-width: 900px) {
      .products { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 650px) {
      .nav-links { display: none; }
      .hero {
        margin: 15px;
        padding: 35px 22px;
        min-height: 360px;
      }
      .products { grid-template-columns: repeat(2, 1fr); }
      .section-title { align-items: stretch; flex-direction: column; }
      .search { width: 100%; }
      main { padding: 5px 15px 50px; }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">URBAN <span>STYLE</span></div>

    <nav class="nav-links">
      <a href="#home">خانه</a>
      <a href="#products">فروشگاه</a>
      <a href="#footer">درباره ما</a>
    </nav>

    <button class="cart-button" onclick="openCart()">
      🛒 سبد
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero" id="home">
  <h1>URBAN STYLE</h1>
  <p>استایل خودت را بساز. جدیدترین لباس‌ها و ترندهای روز را در فروشگاه ما پیدا کن.</p>
  <button onclick="document.getElementById('products').scrollIntoView()">
    مشاهده محصولات
  </button>
</section>

<main>
  <div class="section-title" id="products">
    <h2>محصولات جدید</h2>
    <input class="search" id="search" placeholder="🔍 جستجوی محصول...">
  </div>

  <div class="filters">
    <button class="filter active" data-category="همه">همه</button>
    <button class="filter" data-category="مردانه">مردانه</button>
    <button class="filter" data-category="زنانه">زنانه</button>
    <button class="filter" data-category="اکسسوری">اکسسوری</button>
  </div>

  <div class="products" id="productsGrid"></div>
</main>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<aside class="cart" id="cart">
  <div class="cart-header">
    <h2>🛒 سبد خرید</h2>
    <button class="close" onclick="closeCart()">×</button>
  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">
    <div class="total">
      <span>مجموع:</span>
      <span id="totalPrice">۰ تومان</span>
    </div>

    <button class="checkout" onclick="checkout()">
      ادامه و ثبت سفارش
    </button>
  </div>
</aside>

<footer id="footer">
  <strong>URBAN STYLE</strong>
  <p>فروشگاه آنلاین پوشاک و استایل</p>
  <p>© 2026 تمامی حقوق محفوظ است.</p>
</footer>

<div id="toast"></div>

<script>
  const products = [
    {
      id: 1,
      name: "هودی مشکی کلاسیک",
      category: "مردانه",
      price: 1290000,
      image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 2,
      name: "کت جین شهری",
      category: "مردانه",
      price: 1590000,
      image: "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 3,
      name: "استایل مینیمال",
      category: "زنانه",
      price: 1890000,
      image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 4,
      name: "تی‌شرت اورسایز",
      category: "مردانه",
      price: 790000,
      image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 5,
      name: "کیف شهری",
      category: "اکسسوری",
      price: 990000,
      image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 6,
      name: "لباس روزمره",
      category: "زنانه",
      price: 1490000,
      image: "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 7,
      name: "کلاه استایل",
      category: "اکسسوری",
      price: 490000,
      image: "https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=700&q=80"
    },
    {
      id: 8,
      name: "ژاکت زمستانی",
      category: "مردانه",
      price: 2190000,
      image: "https://images.unsplash.com/photo-1539533113208-f6df8cc8b543?auto=format&fit=crop&w=700&q=80"
    }
  ];

  let cart = JSON.parse(localStorage.getItem("urbanStyleCart") || "[]");
  let currentCategory = "همه";

  const faNumber = number =>
    number.toLocaleString("fa-IR") + " تومان";

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
      toast.style.display = "none";
    }, 2500);
  }

  function renderProducts() {
    const search = document.getElementById("search").value.trim().toLowerCase();

    const filtered = products.filter(product => {
      const categoryMatch =
        currentCategory === "همه" ||
        product.category === currentCategory;

      const searchMatch =
        product.name.toLowerCase().includes(search) ||
        product.category.includes(search);

      return categoryMatch && searchMatch;
    });

    const grid = document.getElementById("productsGrid");

    if (!filtered.length) {
      grid.innerHTML = "<p>محصولی پیدا نشد.</p>";
      return;
    }

    grid.innerHTML = filtered.map(product => `
      <article class="product">
        <img
          class="product-image"
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
        >

        <div class="product-info">
          <div class="product-category">${product.category}</div>
          <h3>${product.name}</h3>

          <div class="product-bottom">
            <div class="price">${faNumber(product.price)}</div>
            <button class="add-button" onclick="addToCart(${product.id})">
              افزودن
            </button>
          </div>
        </div>
      </article>
    `).join("");
  }

  function addToCart(id) {
    const item = cart.find(item => item.id === id);

    if (item) {
      item.quantity++;
    } else {
      cart.push({ id, quantity: 1 });
    }

    saveCart();
    showToast("محصول به سبد خرید اضافه شد 🛍️");
  }

  function saveCart() {
    localStorage.setItem("urbanStyleCart", JSON.stringify(cart));
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById("cartItems");
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);

    document.getElementById("cartCount").textContent =
      count.toLocaleString("fa-IR");

    if (!cart.length) {
      container.innerHTML = `
        <div class="empty">
          <h3>سبد خرید خالی است</h3>
          <p>یک محصول انتخاب کن و به سبد اضافه کن.</p>
        </div>
      `;

      document.getElementById("totalPrice").textContent = "۰ تومان";
      return;
    }

    let total = 0;

    container.innerHTML = cart.map(item => {
      const product = products.find(product => product.id === item.id);
      total += product.price * item.quantity;

      return `
        <div class="cart-item">
          <img src="${product.image}" alt="${product.name}">

          <div>
            <h4>${product.name}</h4>
            <strong>${faNumber(product.price)}</strong>

            <div class="quantity">
              <button onclick="changeQuantity(${product.id}, 1)">+</button>
              <span>${item.quantity.toLocaleString("fa-IR")}</span>
              <button onclick="changeQuantity(${product.id}, -1)">−</button>
            </div>

            <button class="remove" onclick="removeFromCart(${product.id})">
              حذف محصول
            </button>
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("totalPrice").textContent = faNumber(total);
  }

  function changeQuantity(id, change) {
    const item = cart.find(item => item.id === id);
    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {
      cart = cart.filter(item => item.id !== id);
    }

    saveCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    saveCart();
    showToast("محصول حذف شد.");
  }

  function openCart() {
    document.getElementById("cart").classList.add("open");
    document.getElementById("overlay").classList.add("show");
  }

  function closeCart() {
    document.getElementById("cart").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }

  function checkout() {
    if (!cart.length) {
      showToast("سبد خریدت خالی است.");
      return;
    }

    showToast("سیستم ثبت سفارش در نسخه دمو فعال است.");
  }

  document.getElementById("search")
    .addEventListener("input", renderProducts);

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      currentCategory = button.dataset.category;

      document.querySelectorAll(".filter")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");
      renderProducts();
    });
  });

  renderProducts();
  renderCart();
</script>

</body>
 </html>
