
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHgvoAw4cHHD01UfQipDo6z5Z88Me0oCc",
  authDomain: "seven-sins-chat.firebaseapp.com",
  projectId: "seven-sins-chat",
  storageBucket: "seven-sins-chat.firebasestorage.app",
  messagingSenderId: "1009632654398",
  appId: "1:1009632654398:web:c7bc6b9660dfda377bcd6f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let nickname = "";
let currentRoom = "public";
let unsubscribeMessages = null;
let sending = false;

const allowedRooms = ["public", "games", "mystery"];

async function ensureAuth() {
  await auth.authStateReady();

  if (!auth.currentUser) {
    await signInAnonymously(auth);
  }

  if (!auth.currentUser) {
    throw new Error("ورود ناشناس انجام نشد.");
  }

  return auth.currentUser;
}

window.enterChat = async function() {
  const input = document.getElementById("nicknameInput");
  const status = document.getElementById("connectionStatus");
  const name = input.value.trim();

  if (name.length < 2 || name.length > 20) {
    alert("اسم مستعار باید بین ۲ تا ۲۰ حرف باشد.");
    return;
  }

  nickname = name;
  status.textContent = "در حال اتصال به محفل...";

  try {
    await ensureAuth();

    document.getElementById("chatSetup").classList.add("hidden");
    document.getElementById("chatApp").classList.remove("hidden");
    document.getElementById("chatUser").textContent = "☾ " + nickname;

    loadMessages();
  } catch (error) {
    console.error("Firebase Auth Error:", error);
    status.textContent =
      "خطای ورود: " + (error.code || "") + " | " + error.message;
  }
};

window.switchRoom = function(room, button) {
  if (!allowedRooms.includes(room)) return;

  currentRoom = room;

  document.querySelectorAll(".room-buttons button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  const names = {
    public: "اتاق عمومی",
    games: "اتاق بازی‌ها",
    mystery: "اتاق رازها"
  };

  document.getElementById("roomStatus").textContent = names[room];

  loadMessages();
};

function loadMessages() {
  if (!auth.currentUser) return;

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const roomAtStart = currentRoom;
  const box = document.getElementById("messages");

  box.textContent = "در حال دریافت پیام‌های زنده...";

  const messagesRef = collection(
    db, "rooms", roomAtStart, "messages"
  );

  const q = query(
    messagesRef,
    orderBy("createdAt", "desc"),
    limit(100)
  );

  unsubscribeMessages = onSnapshot(
    q,
    snapshot => {
      if (roomAtStart !== currentRoom) return;

      box.innerHTML = "";

      const messages = [];
      snapshot.forEach(doc => messages.push(doc.data()));
      messages.reverse();

      document.getElementById("messageCount").textContent =
        new Intl.NumberFormat("fa-IR").format(messages.length);

      if (messages.length === 0) {
        box.textContent =
          "هنوز پیامی نیست. اولین پیام را تو بفرست! ✦";
        return;
      }

      messages.forEach(message => {
        const div = document.createElement("div");

        div.className =
          message.uid === auth.currentUser?.uid
            ? "message mine"
            : "message";

        const name = document.createElement("div");
        name.className = "message-name";
        name.textContent = message.nickname || "ناشناس";

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text || "";

        const time = document.createElement("div");
        time.className = "message-time";

        if (message.createdAt?.toDate) {
          time.textContent =
            message.createdAt.toDate().toLocaleTimeString(
              "fa-IR",
              { hour: "2-digit", minute: "2-digit" }
            );
        } else {
          time.textContent = "همین الان";
        }

        div.append(name, text, time);
        box.appendChild(div);
      });

      box.scrollTop = box.scrollHeight;
    },
    error => {
      console.error("Firestore Read Error:", error);

      if (roomAtStart !== currentRoom) return;

      box.textContent =
        "خطای دریافت پیام: " +
        (error.code || "") + " | " + error.message;
    }
  );
}

document.getElementById("messageForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text || sending) return;

    if (!auth.currentUser) {
      alert("هنوز به محفل وصل نشده‌ای. دوباره وارد شو.");
      return;
    }

    if (!allowedRooms.includes(currentRoom)) return;

    sending = true;

    const submitButton =
      document.querySelector("#messageForm button[type='submit']");

    submitButton.disabled = true;

    try {
      await addDoc(
        collection(db, "rooms", currentRoom, "messages"),
        {
          uid: auth.currentUser.uid,
          nickname: nickname,
          text: text,
          createdAt: serverTimestamp()
        }
      );

      input.value = "";
    } catch (error) {
      console.error("Firestore Send Error:", error);

      alert(
        "پیام ارسال نشد:\n" +
        (error.code || "") + "\n" +
        error.message
      );
    } finally {
      sending = false;
      submitButton.disabled = false;
      input.focus();
    }
  });

window.addEmoji = function(emoji) {
  const input = document.getElementById("messageInput");
  input.value += emoji;
  input.focus();
};

onAuthStateChanged(auth, user => {
  if (user) {
    console.log("Seven Sins connected:", user.uid);
  } else {
    console.log("Seven Sins: waiting for sign in");
  }
});
</script>
