<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amir & Yalda</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b12;font-family:Tahoma}
#hud{position:fixed;top:15px;left:0;width:100%;text-align:center;color:white;z-index:5;pointer-events:none}
#mission{display:inline-block;background:#111d;padding:13px 22px;border:1px solid #c49b55;border-radius:12px}
#distance{margin-top:10px;color:#ffd58a}
#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 25px;z-index:5}
.pad{width:110px;height:110px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;color:white;font-size:27px;display:grid;place-items:center;touch-action:none}
#run{width:85px;height:85px;border-radius:50%;background:#b98a3d99}
#message{position:fixed;top:45%;width:100%;text-align:center;color:white;font-size:24px;display:none;z-index:10}
</style>
</head>
<body>
<div id="hud">
 <div id="mission">ماموریت: به یلدا برس!</div>
 <div id="distance">فاصله: ۳۰ متر</div>
</div>
<div id="message"></div>
<div id="controls">
 <div class="pad" id="move">▲</div>
 <div class="pad" id="run">بدو!</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101725);
scene.fog=new THREE.Fog(0x101725,25,115);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xaabbdd,0x25202a,2));
const moon=new THREE.DirectionalLight(0xffdfb0,2.5);
moon.position.set(-10,20,10);
moon.castShadow=true;
scene.add(moon);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const skin=mat(0xc68e70), darkSkin=mat(0x9d6856);
const black=mat(0x171923), jacket=mat(0x252a35);
const pants=mat(0x171a24), shoe=mat(0xeeeeea);
const hair=mat(0x17120f), eye=mat(0x17100d);
const white=mat(0xf0e9dc), red=mat(0x812f3e);

function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),material);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);
 m.castShadow=true;parent.add(m);return m;
}
function limb(parent,a,b,r1,r2,material){
 const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b);
 const d=new THREE.Vector3().subVectors(end,start);
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),12),material);
 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
 mesh.castShadow=true;parent.add(mesh);return mesh;
}

function person(isAmir){
 const root=new THREE.Group();
 const clothes=isAmir?jacket:red;
 const legs=[];
 const arms=[];

 // تنه و گردن
 sphere(root,0,1.23,0,.34,.48,.20,clothes);
 sphere(root,0,.91,0,.25,.22,.16,pants);
 sphere(root,0,1.73,0,.105,.16,.11,skin);

 // سر
 sphere(root,0,2.02,0,.22,.29,.20,skin);
 // گوش‌ها
 sphere(root,-.22,2.03,0,.045,.075,.04,skin);
 sphere(root,.22,2.03,0,.045,.075,.04,skin);
 // مو
 sphere(root,0,2.22,-.025,.23,.15,.21,hair);
 sphere(root,-.15,2.14,.07,.09,.12,.12,hair);
 sphere(root,.12,2.16,.07,.10,.12,.12,hair);
 // چشم‌ها
 sphere(root,-.085,2.06,.18,.025,.025,.015,eye);
 sphere(root,.085,2.06,.18,.025,.025,.015,eye);
 // بینی و دهان
 sphere(root,0,1.99,.205,.035,.065,.045,skin);
 sphere(root,0,1.91,.19,.055,.015,.012,red);

 // جزئیات لباس
 if(isAmir){
   sphere(root,0,1.32,.205,.13,.08,.012,white);
 }else{
   sphere(root,0,1.28,.205,.12,.025,.012,white);
   sphere(root,0,1.02,.18,.08,.10,.02,black);
 }

 // دست‌ها
 for(const side of [-1,1]){
   const shoulder=[side*.37,1.48,0];
   const elbow=[side*.43,1.18,0];
   const hand=[side*.43,1.0,.03];
   const upper=limb(root,shoulder,elbow,.105,.08,clothes);
   const lower=limb(root,elbow,hand,.075,.045,skin);
   sphere(root,...hand,.065,.07,.06,skin);
   arms.push({upper,lower,side});
 }

 // پاها
 for(const side of [-1,1]){
   const hip=[side*.14,.85,0];
   const knee=[side*.16,.48,0];
   const ankle=[side*.16,.12,0];
   const upper=limb(root,hip,knee,.13,.09,pants);
   const lower=limb(root,knee,ankle,.085,.055,pants);
   const foot=sphere(root,side*.16,.07,.10,.09,.07,.17,shoe);
   legs.push({upper,lower,foot,side});
 }
 root.userData={legs,arms,isAmir};
 return root;
}

// خیابان
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x252936));
ground.rotation.x=-Math.PI/2;ground.position.y=-.04;
ground.receiveShadow=true;scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(13,180),mat(0x151923));
road.rotation.x=-Math.PI/2;road.position.set(0,.005,-35);scene.add(road);

// خط‌های خیابان
for(let z=15;z>-100;z-=9){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.12,.02,4),mat(0xc4b58d));
 line.position.set(0,.025,z);scene.add(line);
}

// ساختمان‌ها
for(let z=10;z>-100;z-=13){
 for(const side of [-1,1]){
  const h=8+Math.random()*16;
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(5,h,10),
   mat(side===1?0x303442:0x242b38)
  );
  building.position.set(side*10,h/2,z);
  building.castShadow=true;scene.add(building);
  for(let y=2;y<h-1;y+=2.3){
   for(let x=-1.5;x<=1.5;x+=1.5){
    const window=new THREE.Mesh(
     new THREE.PlaneGeometry(.65,.9),
     new THREE.MeshBasicMaterial({color:Math.random()>.35?0xffd18a:0x34445c})
    );
    window.position.set(side*7.47,y,z+x);
    window.rotation.y=side===1?Math.PI/2:-Math.PI/2;
    scene.add(window);
   }
  }
 }
}

// چراغ‌های خیابان
for(let z=10;z>-90;z-=18){
 for(const side of [-1,1]){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,5,8),black);
  pole.position.set(side*5,2.5,z);scene.add(pole);
  const lamp=new THREE.PointLight(0xffbd73,25,13);
  lamp.position.set(side*5,5,z);scene.add(lamp);
  sphere(scene,side*5,5,z,.17,.17,.17,mat(0xffd49b));
 }
}

const amir=person(true),yalda=person(false);
scene.add(amir,y alda);
</script>
</body>
</html>
