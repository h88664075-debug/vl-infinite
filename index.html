<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AMIR & YALDA | 3D Chase</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b13;font-family:Tahoma,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#101827cc;border:1px solid #b69a60;padding:12px 17px;border-radius:12px}
#mission{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:#101827cc;padding:10px 18px;border-radius:12px;border:1px solid #b69a60;white-space:nowrap}
#message{position:fixed;top:135px;left:50%;transform:translateX(-50%);color:#f2d28b}
#controls{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:5px;pointer-events:auto}
.ctrl{border:1px solid #c5a66a;background:#17243bcc;color:white;border-radius:13px;font-size:22px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#run{width:78px;height:78px;border-radius:50%;font-size:16px;pointer-events:auto}
#restart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#8d6b35;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<div id="hud">
 <div class="panel">AMIR<br><small>شخصیت اصلی</small></div>
 <div class="panel">فاصله: <span id="distance">0</span> متر</div>
</div>
<div id="mission">ماموریت: به یلدا در مسیر مسابقه برس!</div>
<div id="message">با کلیدهای جهت‌دار حرکت کن</div>
<div id="controls">
 <div class="pad">
  <button class="ctrl" id="up">▲</button>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="down">▼</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <button class="ctrl" id="run">دویدن</button>
</div>
<button id="restart">شروع دوباره</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101827);
scene.fog=new THREE.Fog(0x101827,25,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9eb5df,0x25202a,2));
const moon=new THREE.DirectionalLight(0xc7d7ff,2.3);
moon.position.set(-15,25,10);
moon.castShadow=true;
scene.add(moon);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x252934,roughness:.9})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

// خیابان
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(12,180),
 new THREE.MeshStandardMaterial({color:0x171a22,roughness:.85})
);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-45);
road.receiveShadow=true;
scene.add(road);

// خط‌های وسط خیابان
for(let z=5;z>-100;z-=9){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.13,.025,4),
  new THREE.MeshStandardMaterial({color:0xd8c58d})
 );
 line.position.set(0,.02,z);
 scene.add(line);
}

// ساختمان‌ها
for(let z=10;z>-105;z-=13){
 for(const side of [-1,1]){
  const h=8+Math.random()*12;
  const w=5+Math.random()*4;
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,10),
   new THREE.MeshStandardMaterial({
    color:side===1?0x343044:0x293344,
    roughness:.9
   })
  );
  building.position.set(side*(9+w/2),h/2-0.1,z);
  building.castShadow=true;
  building.receiveShadow=true;
  scene.add(building);

  // پنجره‌ها
  for(let y=2;y<h-1;y+=2.4){
   for(let x=-w/2+1;x<w/2;x+=1.8){
    const windowMesh=new THREE.Mesh(
     new THREE.BoxGeometry(.75,.95,.06),
     new THREE.MeshStandardMaterial({
      color:Math.random()>.35?0xffd58a:0x263a52,
      emissive:Math.random()>.35?0x8c5422:0x101c32,
      emissiveIntensity:.7
     })
    );
    windowMesh.position.set(side*(9+w/2)+x,y,z+5.04);
    scene.add(windowMesh);
   }
  }
 }
}

// چراغ‌های خیابان
for(let z=8;z>-100;z-=17){
 for(const side of [-1,1]){
  const pole=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.13,5,8),
   new THREE.MeshStandardMaterial({color:0x34313b,metalness:.6})
  );
  pole.position.set(side*6,2.5,z);
  scene.add(pole);
  const bulb=new THREE.PointLight(0xffc77c,65,16,2);
  bulb.position.set(side*6,5,z);
  scene.add(bulb);
  const lamp=new THREE.Mesh(
   new THREE.SphereGeometry(.22,12,12),
   new THREE.MeshBasicMaterial({color:0xffd69b})
  );
  lamp.position.copy(bulb.position);
  scene.add(lamp);
 }
}

// ساخت شخصیت سه‌بعدی
function makePerson(name,coat,hairColor,skinColor){
 const root=new THREE.Group();
 const clothes=new THREE.MeshStandardMaterial({color:coat,roughness:.8});
 const skin=new THREE.MeshStandardMaterial({color:skinColor,roughness:.8});
 const hairMat=new THREE.MeshStandardMaterial({color:hairColor,roughness:.9});
 const dark=new THREE.MeshStandardMaterial({color:0x17131a});

 function add(geo,mat,x,y,z,parent=root){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
 }

 // بدن و سر
 add(new THREE.CapsuleGeometry(.43,.65,5,10),clothes,0,1.25,0);
 add(new THREE.SphereGeometry(.29,20,16),skin,0,2.05,0);
 add(new THREE.SphereGeometry(.30,20,16),hairMat,0,2.23,.035);

 // موهای پشت سر
 add(new THREE.SphereGeometry(.28,16,12),hairMat,0,2.02,.17);

 // چشم‌ها
 for(const x of [-.105,.105]){
  add(new THREE.SphereGeometry(.035,10,8),dark,x,2.08,-.255);
 }

 // پاها
 const legs=[];
 for(const x of [-.19,.19]){
  const leg=new THREE.Mesh(
   new THREE.CapsuleGeometry(.13,.55,4,8),dark
  );
  leg.position.set(x,.55,0);
  leg.castShadow=true;
  root.add(leg);
  legs.push(leg);
 }

 // دست‌ها
 const arms=[];
 for(const x of [-.51,.51]){
  const arm=new THREE.Mesh(
   new THREE.CapsuleGeometry(.105,.55,4,8),skin
  );
  arm.position.set(x,1.35,0);
  arm.castShadow=true;
  root.add(arm);
  arms.push(arm);
 }

 root.userData={legs,arms,name};
 scene.add(root);
 return root;
}

const amir=makePerson('AMIR',0x202b3d,0x171014,0xc58d6c);
const yalda=makePerson('YALDA',0x492d55,0x171018,0xe0b18e);

amir.position.set(0,0,2);
yalda.position.set(0,0,-9);

function makeLabel(text){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#ffffff';
 ctx.font='bold 60px Arial';
 ctx.textAlign='center';
 ctx.fillText(text,256,80);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.scale.set(2.5,.65,1);
 return sprite;
}
const labelA=makeLabel('AMIR');
const labelY=makeLabel('YALDA');
amir.add(labelA);labelA.position.set(0,2.8,0);
yalda.add(labelY);labelY.position.set(0,2.8,0);

let keys={};
let mobile={};
let time=0;
let won=false;

function press(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();mobile[key]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(type=>
  el.addEventListener(type,()=>mobile[key]=false)
 );
}
press('up','w');press('down','s');press('left','a');press('right','d');
press('run','shift');

window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function restart(){
 amir.position.set(0,0,2);
 yalda.position.set(0,0,-9);
 won=false;
 document.getElementById('message').textContent='به یلدا برس!';
}
document.getElementById('restart').onclick=restart;

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 time+=dt;

 if(!won){
  const forward=keys.w||keys.arrowup||mobile.w;
  const back=keys.s||keys.arrowdown||mobile.s;
  const left=keys.a||keys.arrowleft||mobile.a;
  const right=keys.d||keys.arrowright||mobile.d;
  const running=keys.shift||mobile.shift;

  const speed=running?8:4.8;
  if(forward)amir.position.z-=speed*dt;
  if(back)amir.position.z+=speed*.65*dt;
  if(left)amir.position.x-=speed*.7*dt;
  if(right)amir.position.x+=speed*.7*dt;

  amir.position.x=THREE.MathUtils.clamp(amir.position.x,-4.5,4.5);
  amir.position.z=Math.min(amir.position.z,4);

  // یلدا در مسیر مسابقه می‌دود
  yalda.position.z-=2.1*dt;
  yalda.position.x=Math.sin(time*.8)*1.1;

  const distance=Math.max(0,Math.round(amir.position.distanceTo(yalda.position)));
  document.getElementById('distance').textContent=distance;

  const moving=forward||back||left||right;
  const swing=moving?Math.sin(time*13)*.55:0;
  amir.userData.legs[0].rotation.x=swing;
  amir.userData.legs[1].rotation.x=-swing;
  amir.userData.arms[0].rotation.x=-swing;
  amir.userData.arms[1].rotation.x=swing;

  const yswing=Math.sin(time*10)*.45;
  yalda.userData.legs[0].rotation.x=yswing;
  yalda.userData.legs[1].rotation.x=-yswing;
  yalda.userData.arms[0].rotation.x=-yswing;
  yalda.userData.arms[1].rotation.x=yswing;

  if(amir.position.distanceTo(yalda.position)<1.6){
   won=true;
   document.getElementById('message').textContent='مرحله تمام شد! به یلدا رسیدی!';
  }
 }

 // دوربین دنبال امیر حرکت می‌کند
 const desired=new THREE.Vector3(
  amir.position.x*.45,
  4.2,
  amir.position.z+8
 );
 camera.position.lerp(desired,.09);
 camera.lookAt(amir.position.x,1.4,amir.position.z-5);

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
