<!-- اتصال چت سایت به Firebase -->
<script>
(async function () {
  const firebaseConfig = {
    apiKey: "AIzaSyDHgvoAw4cHHD01UfQipDo6z5Z88Me0oCc",
    authDomain: "seven-sins-chat.firebaseapp.com",
    projectId: "seven-sins-chat",
    storageBucket: "seven-sins-chat.firebasestorage.app",
    messagingSenderId: "1009632654398",
    appId: "1:1009632654398:web:c7bc6b9660dfda377bcd6f"
  };

  try {
    // بارگذاری Firebase
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js";
      script.onload = resolve;
      script.onerror = () => reject(new Error("Firebase بارگذاری نشد"));
      document.head.appendChild(script);
    });

    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js";
      script.onload = resolve;
      script.onerror = () => reject(new Error("Firebase Auth بارگذاری نشد"));
      document.head.appendChild(script);
    });

    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src =
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js";
      script.onload = resolve;
      script.onerror = () => reject(new Error("Firebase Firestore بارگذاری نشد"));
      document.head.appendChild(script);
    });

    // اتصال به Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    // ورود ناشناس
    await auth.signInAnonymously();

    // محل ذخیره پیام‌ها
    const messagesRef = db
      .collection("rooms")
      .doc("main")
      .collection("messages");

    let onlineMessages = [];

    // دریافت آنلاین پیام‌ها
    messagesRef
      .orderBy("createdAt", "asc")
      .limit(300)
      .onSnapshot(
        (snapshot) => {
          onlineMessages = snapshot.docs.map((doc) => ({
            id: doc.id,
            ...doc.data()
          }));

          renderOnlineChat();
        },
        (error) => {
          console.error("خطای دریافت پیام:", error);
        }
      );

    // نمایش پیام‌ها
    function renderOnlineChat() {
      const container = document.getElementById("chatMessages");
      if (!container) return;

      if (onlineMessages.length === 0) {
        container.innerHTML =
          '<div class="empty">هنوز پیامی وجود ندارد. اولین پیام را بفرست!</div>';
      } else {
        container.innerHTML = onlineMessages
          .map((msg) => {
            const sender =
              typeof safe === "function"
                ? safe(String(msg.sender || "عضو"))
                : String(msg.sender || "عضو");

            const text =
              typeof safe === "function"
                ? safe(String(msg.text || ""))
                : String(msg.text || "");

            let time = "";

            if (msg.createdAt && msg.createdAt.toDate) {
              time = msg.createdAt
                .toDate()
                .toLocaleString("fa-IR");
            }

            return `
              <div class="msg">
                <b>${sender}</b>
                <div>${text.replace(/\n/g, "<br>")}</div>
                <small>${time}</small>
              </div>
            `;
          })
          .join("");
      }

      container.scrollTop = container.scrollHeight;

      const count = document.getElementById("chatCount");
      if (count) {
        count.textContent = onlineMessages.length + " پیام";
      }

      const total = document.getElementById("totalMessages");
      if (total) {
        total.textContent = onlineMessages.length;
      }
    }

    // ارسال پیام آنلاین
    window.sendMessage = async function () {
      const senderEl = document.getElementById("chatSender");
      const input = document.getElementById("chatInput");

      if (!input) return;

      const text = input.value.trim();

      if (!text) return;

      const sender = senderEl
        ? senderEl.value
        : "عضو اکیپ";

      if (text.length > 500) {
        alert("پیام نباید بیشتر از ۵۰۰ کاراکتر باشد.");
        return;
      }

      input.value = "";

      try {
        await messagesRef.add({
          sender: String(sender).slice(0, 40),
          text: text,
          uid: auth.currentUser
            ? auth.currentUser.uid
            : "unknown",
          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (error) {
        console.error(error);
        input.value = text;
        alert("ارسال پیام ناموفق بود: " + error.message);
      }
    };

    // جلوگیری از خطا در دکمه‌های قدیمی
    window.deleteMessage = function () {
      alert("حذف پیام آنلاین فعلاً غیرفعال است.");
    };

    window.clearChat = function () {
      alert("پاک کردن همه پیام‌ها در چت آنلاین فعلاً غیرفعال است.");
    };

    console.log("SEVEN SINS Firebase Chat Connected!");

  } catch (error) {
    console.error("خطای Firebase:", error);
    alert("خطای اتصال Firebase: " + error.message);
  }
})();
</script>

</body>
</html>
